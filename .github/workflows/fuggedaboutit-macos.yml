name: Fuggedaboutit Radio Intel Mac Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-mac-beta*'

permissions:
  contents: write

jobs:
  package-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build Intel macOS server and ingestor
        run: |
          set -euo pipefail
          mkdir -p dist
          for cmd in server ingestor; do
            (cd "cmd/$cmd" && CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -o "../../dist/fuggedaboutit-$cmd" .)
          done
          file dist/fuggedaboutit-*
      - name: Package command-line preview (NOT a desktop app)
        run: |
          set -euo pipefail
          mkdir -p package
          cp dist/fuggedaboutit-server dist/fuggedaboutit-ingestor package/
          cp -R public package/public
          cp config.example.json package/
          cat > package/README.txt <<'EOF'
          FUGGEDABOUTIT RADIO — Intel macOS command-line preview
          This is NOT yet a double-clickable .app or DMG.
          The server and ingestor are unsigned Go executables.
          Configuration and an MQTT packet source are required.
          Refer to repository documentation before running.
          EOF
          cd package
          zip -qr ../fuggedaboutit-radio-macos-intel-cli-preview.zip .
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuggedaboutit-radio-macos-intel-cli-preview
          path: fuggedaboutit-radio-macos-intel-cli-preview.zip
          if-no-files-found: error
      - name: Publish prerelease on beta tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" fuggedaboutit-radio-macos-intel-cli-preview.zip --prerelease --title "Fuggedaboutit Radio ${GITHUB_REF_NAME} — Intel CLI preview" --notes "Unsigned Intel macOS command-line preview. Not yet a click-to-open Mac app. Requires configuration and MQTT data source."
